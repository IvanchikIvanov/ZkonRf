version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zakonrff-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zakonrff}
      POSTGRES_USER: ${POSTGRES_USER:-zakonrff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zakonrff}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zakonrff} -d ${POSTGRES_DB:-zakonrff}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zakonrff-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../data/embeddings:/app/data/embeddings
      - ../data/codexes:/app/data/codexes
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

volumes:
  redis_data:
  postgres_data:

